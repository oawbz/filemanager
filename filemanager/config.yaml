server:
  host: 0.0.0.0 # 监听地址
  port: 8080 # 监听端口
  root_dir: ./ # 根目录
  dav_public_prefix: /dav # WebDAV 对外访问前缀（反向代理子路径时设置，例如 /admin/dav） 留空或删除该项时，默认使用 /dav

users:
  # 第一个用户为管理员
  - username: admin
    password: "admin123"

shell: false # 是否启用终端功能 false/true

mcp:
  token: ""  # MCP 访问令牌（留空表示关闭）
